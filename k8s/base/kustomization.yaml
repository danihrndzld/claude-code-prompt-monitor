apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: prompts-monitoreo
resources:
  - namespace.yaml
  - collector.yaml
  - prompt-guard.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: otel-config
    files:
      - config.yaml=collector-config.yaml
secretGenerator:
  - name: prompts-tokens
    envs:
      - secrets.env   # copiar de secrets.env.example; el archivo real nunca entra al repo
generatorOptions:
  disableNameSuffixHash: true
