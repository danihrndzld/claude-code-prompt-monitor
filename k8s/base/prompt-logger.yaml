# Receptor del hook UserPromptSubmit: valida token y reenvía al colector, no bloquea.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prompt-logger
  labels: { app: prompt-logger }
spec:
  replicas: 2
  selector:
    matchLabels: { app: prompt-logger }
  template:
    metadata:
      labels: { app: prompt-logger }
    spec:
      containers:
        - name: receiver
          image: registry.example.internal/platform/prompt-logger:0.1   # build con ../Containerfile
          ports:
            - { name: http, containerPort: 8080 }
          env:
            - { name: OTLP_ENDPOINT, value: "http://otel-collector:4318/v1/logs" }
            - name: OTLP_TOKEN
              valueFrom: { secretKeyRef: { name: prompts-tokens, key: OTLP_INGEST_TOKEN } }
            - name: HOOK_TOKEN
              valueFrom: { secretKeyRef: { name: prompts-tokens, key: HOOK_TOKEN } }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 3
          livenessProbe:
            tcpSocket: { port: http }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: prompt-logger
spec:
  selector: { app: prompt-logger }
  ports:
    - { name: http, port: 8080, targetPort: http }
---
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: prompt-logger
spec:
  host: prompt-logger.example.internal
  to: { kind: Service, name: prompt-logger }
  port: { targetPort: http }
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
